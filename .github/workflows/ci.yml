name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the deployment target still offers; 8.4 is what it
        # defaults to. Both have to work or the hosting claim is not true.
        php: ['7.4', '8.1', '8.4']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, iconv, curl, zlib
          coverage: none
          tools: none

      - name: Refuse a dependency manifest
        run: |
          # The whole premise is that this runs on shared hosting untouched.
          for f in composer.json package.json composer.lock package-lock.json; do
            if [ -e "$f" ]; then
              echo "::error file=$f::$f exists — this project must stay dependency-free"
              exit 1
            fi
          done
          echo "no dependency manifests, as intended"

      - name: Lint every PHP file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::syntax error"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $fail

      - name: Run the test suite
        run: php tests/run.php

      - name: docs/SIGNALS.md matches lib/Catalog.php
        run: php tools/gen-signals-doc.php --check

      - name: SVG assets match lib/Brand.php
        run: |
          php tools/build-assets.php
          if ! git diff --quiet -- assets/img; then
            echo "::error::assets/img is stale — run: php tools/build-assets.php"
            git diff --stat -- assets/img
            exit 1
          fi
          echo "assets are current"

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, iconv, curl, zlib
          coverage: none
          tools: none

      - name: Serve it
        run: |
          php -S 127.0.0.1:8080 > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 0.5
          done

      - name: The homepage renders
        run: |
          body=$(curl -sf http://127.0.0.1:8080/)
          echo "$body" | grep -q 'Vibe Code Detector' || { echo "::error::no title"; exit 1; }
          echo "$body" | grep -q 'github.com/goldo9824/vibecode-detector' || { echo "::error::repo link missing"; exit 1; }
          if echo "$body" | grep -qi '<?php'; then echo "::error::PHP leaked into the output"; exit 1; fi
          echo "homepage OK ($(echo "$body" | wc -c) bytes)"

      - name: The front page is the analyser, and the argument has a page
        run: |
          home=$(curl -sf http://127.0.0.1:8080/)
          echo "$home" | grep -q 'id="analyzer"' || { echo "::error::no analyser on the front page"; exit 1; }
          echo "$home" | grep -q 'class="band"' && { echo "::error::long-form sections are back on the front page"; exit 1; }
          method=$(curl -sf http://127.0.0.1:8080/method.php)
          for anchor in 'id="method"' 'id="limits"' 'id="provenance"'; do
            echo "$method" | grep -q "$anchor" || { echo "::error::method.php is missing $anchor"; exit 1; }
          done
          echo "front page OK ($(echo "$home" | wc -c) bytes), method OK ($(echo "$method" | wc -c) bytes)"

      - name: Auto mode works out what it was given
        run: |
          check() {
            got=$(curl -s -X POST http://127.0.0.1:8080/api/analyze.php \
                    -F mode=auto -F "input=<$1" \
                  | sed -n 's/.*"mode":"\([a-z]*\)".*/\1/p')
            if [ "$got" != "$2" ]; then
              echo "::error::auto read $1 as '$got', wanted '$2'"; exit 1
            fi
            echo "auto -> $2 OK"
          }
          printf 'function x() { return 1 }\n' > /tmp/probe-code.txt
          printf 'commit 9f8e7d6c5b4a3210\nAuthor: D <d@e.com>\nDate:   Tue Jan 14 11:02:03 2025 +0000\n\n    tidy\n' > /tmp/probe-git.txt
          check /tmp/probe-code.txt code
          check /tmp/probe-git.txt git

      - name: The reading settings are on every panel that spends someone else's resources
        run: |
          home=$(curl -sf http://127.0.0.1:8080/)
          for id in params-open-auto pages-auto files-auto params-open-url pages-url params-open-repo files-repo; do
            echo "$home" | grep -q "id=\"$id\"" || { echo "::error::missing #$id"; exit 1; }
          done
          for id in files-url pages-repo; do
            echo "$home" | grep -q "id=\"$id\"" && { echo "::error::#$id is on a panel it means nothing to"; exit 1; }
          done
          echo "$home" | grep -q 'id="crawl"' && { echo "::error::the whole-site tickbox is back"; exit 1; }
          echo "reading settings OK"

      - name: An out-of-range page count is clamped, not refused
        run: |
          got=$(curl -s -X POST http://127.0.0.1:8080/api/analyze.php \
                  -F mode=repo -F repo=not-a-repo -F files=9000 -o /dev/null -w '%{http_code}')
          # Refused for naming a repository that is not one, never for the slider.
          [ "$got" = "400" ] || { echo "::error::files=9000 gave HTTP $got, wanted a plain 400 about the repo"; exit 1; }
          echo "clamping OK"

      - name: The signal catalogue renders every signal
        run: |
          body=$(curl -sf http://127.0.0.1:8080/catalogue.php)
          echo "$body" | grep -q 'The signal catalogue' || { echo "::error::no heading"; exit 1; }
          # Every id in lib/Catalog.php has to appear on the page that claims
          # to list all of them, or the page is quietly lying about its subject.
          missing=0
          for id in $(php -r 'require "lib/bootstrap.php"; echo implode(" ", array_keys(Catalog::all()));'); do
            echo "$body" | grep -q ">$id<" || { echo "::error::$id is missing from /catalogue"; missing=1; }
          done
          [ "$missing" = "0" ] || exit 1
          echo "catalogue OK ($(echo "$body" | wc -c) bytes)"

      - name: A repository that is not one is refused by name
        run: |
          body=$(curl -s -X POST http://127.0.0.1:8080/api/analyze.php -F mode=repo -F "repo=https://gitlab.com/group/project")
          echo "$body" | grep -q '"ok":false' || { echo "::error::not refused: $body"; exit 1; }
          echo "$body" | grep -q 'not GitHub' || { echo "::error::refused without saying why: $body"; exit 1; }
          echo "refused a repository on another forge"

      - name: Code analysis returns a scored result
        run: |
          json=$(curl -sf -X POST http://127.0.0.1:8080/api/analyze.php \
                   -F mode=code \
                   -F "code=<tests/fixtures/ai-code.js")
          echo "$json" | head -c 300; echo
          echo "$json" | grep -q '"ok":true' || { echo "::error::not ok"; exit 1; }
          echo "$json" | grep -q '"score":' || { echo "::error::no score"; exit 1; }
          echo "$json" | grep -q '"cert":' || { echo "::error::no certificate token"; exit 1; }

      - name: The certificate downloads as a real PDF
        run: |
          json=$(curl -sf -X POST http://127.0.0.1:8080/api/analyze.php \
                   -F mode=code -F "code=<tests/fixtures/ai-code.js")
          p=$(printf '%s' "$json" | sed -n 's/.*"payload":"\([^"]*\)".*/\1/p')
          s=$(printf '%s' "$json" | sed -n 's/.*"sig":"\([^"]*\)".*/\1/p')
          curl -sf "http://127.0.0.1:8080/api/certificate.php?p=$p&s=$s" -o /tmp/cert.pdf
          head -c 8 /tmp/cert.pdf | grep -q '%PDF-1.4' || { echo "::error::not a PDF"; exit 1; }
          tail -c 6 /tmp/cert.pdf | grep -q '%%EOF' || { echo "::error::truncated PDF"; exit 1; }
          echo "certificate OK ($(stat -c%s /tmp/cert.pdf) bytes)"

      - name: A result carries a way to report it
        run: |
          home=$(curl -sf http://127.0.0.1:8080/)
          echo "$home" | grep -q 'id="r-report"' || { echo "::error::no report block under the result"; exit 1; }
          for value in too_high too_low about_right; do
            echo "$home" | grep -q "value=\"$value\"" || { echo "::error::the report form cannot say $value"; exit 1; }
          done
          # With no database configured there is nowhere to file one, and the
          # page has to say so rather than take a report and drop it.
          echo "$home" | grep -q 'data-collect="0"' || { echo "::error::the block claims to collect reports with no database"; exit 1; }
          echo "report block OK"

      - name: A report is only accepted with the reading it disputes
        run: |
          json=$(curl -sf -X POST http://127.0.0.1:8080/api/analyze.php \
                   -F mode=code -F "code=<tests/fixtures/ai-code.js")
          p=$(printf '%s' "$json" | sed -n 's/.*"payload":"\([^"]*\)".*/\1/p')
          s=$(printf '%s' "$json" | sed -n 's/.*"sig":"\([^"]*\)".*/\1/p')

          good=$(curl -s -X POST http://127.0.0.1:8080/api/feedback.php \
                   -F "p=$p" -F "s=$s" -F direction=too_high -F truth=human)
          echo "$good" | grep -q '"ok":true' || { echo "::error::a signed reading was refused: $good"; exit 1; }
          # No database here, so it is accepted and honestly reported as unfiled.
          echo "$good" | grep -q '"recorded":false' || { echo "::error::claims to have filed a report with no database: $good"; exit 1; }

          forged=$(curl -s -X POST http://127.0.0.1:8080/api/feedback.php \
                     -F "p=$p" -F "s=deadbeef" -F direction=too_low)
          echo "$forged" | grep -q '"ok":false' || { echo "::error::an unsigned reading was accepted: $forged"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/feedback.php)
          [ "$code" = "405" ] || { echo "::error::GET on the report endpoint gave $code, wanted 405"; exit 1; }
          echo "report endpoint OK"

      - name: A tampered certificate is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                  "http://127.0.0.1:8080/api/certificate.php?p=forged&s=deadbeef")
          [ "$code" = "400" ] || { echo "::error::expected 400, got $code"; exit 1; }
          echo "forgery refused"

      - name: The fetcher refuses local addresses
        run: |
          for target in "http://127.0.0.1:8080/" "http://169.254.169.254/" "http://localhost/"; do
            body=$(curl -s -X POST http://127.0.0.1:8080/api/analyze.php -F mode=url -F "url=$target")
            echo "$body" | grep -q '"ok":false' || { echo "::error::$target was not refused: $body"; exit 1; }
            echo "refused $target"
          done

      - name: Server log
        if: always()
        run: cat /tmp/server.log || true
